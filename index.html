<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bombeiros Fluxo — Chat com Voz e Tela</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TELA DE ENTRADA -->
  <div id="lobby" class="screen">
    <div class="lobby-bg" aria-hidden="true"></div>
    <div class="lobby-card">
      <img class="lobby-logo" src="assets/logo.png" alt="Bombeiros Fluxo" />
      <h1>Bombeiros Fluxo</h1>
      <p class="subtitle">Salas livres com texto, voz e compartilhamento de tela</p>

      <label>Seu nome</label>
      <input id="nameInput" type="text" placeholder="Como quer ser chamado?" maxlength="30" />

      <label>Sala</label>
      <input id="roomInput" type="text" placeholder="Nome da sala (ex: geral, jogos, estudo)" maxlength="60" />

      <button id="joinBtn">Entrar na sala</button>
      <p class="hint">Dica: pressione Enter para entrar rapidamente.</p>

      <div class="room-list-box">
        <h3>Salas ativas agora</h3>
        <ul id="roomList"><li class="empty">Nenhuma sala ativa ainda.</li></ul>
      </div>
    </div>
  </div>

  <!-- TELA DA SALA -->
  <div id="roomScreen" class="screen hidden">
    <header class="room-header">
      <div class="room-header-left">
        <img class="header-logo" src="assets/logo.png" alt="" />
        <div>
          <strong id="roomTitle"></strong>
          <span id="roomCount" class="muted"></span>
        </div>
      </div>
      <div class="header-actions">
        <button id="micBtn" class="icon-btn" title="Ligar/desligar microfone">
          <span class="icon">🎤</span><span class="btn-label">Microfone</span>
        </button>
        <button id="shareBtn" class="icon-btn" title="Compartilhar tela">
          <span class="icon">🖥️</span><span class="btn-label">Tela</span>
        </button>
        <button id="fullscreenBtn" class="icon-btn" title="Tela cheia">
          <span class="icon">⛶</span><span class="btn-label">Cheia</span>
        </button>
        <button id="leaveBtn" class="icon-btn danger" title="Sair da sala">
          <span class="icon">🚪</span><span class="btn-label">Sair</span>
        </button>
      </div>
    </header>

    <main class="room-body">
      <aside class="sidebar">
        <h4>Participantes</h4>
        <ul id="userList"></ul>
      </aside>

      <section class="center">
        <div id="screenGrid" class="screen-grid"></div>

        <div id="chatMessages" class="chat-messages"></div>

        <form id="chatForm" class="chat-form">
          <input id="chatInput" type="text" placeholder="Digite uma mensagem..." autocomplete="off" maxlength="2000" />
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
  </div>

  <audio id="remoteAudioContainer" style="display:none;"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
